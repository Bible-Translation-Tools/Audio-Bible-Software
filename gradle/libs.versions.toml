[versions]
agp = "9.1.0"
android-compileSdk = "37"
# 24 = Android 7.0. java.time and java.nio.file only reached the platform at API 26, so this
# floor is only safe alongside core library desugaring — see `desugar` below and the
# coreLibraryDesugaring dependency in each android module.
android-minSdk = "24"
android-targetSdk = "37"
# The _nio variant, NOT plain desugar_jdk_libs: the standard artifact backports java.time but
# not java.nio.file, which the backend uses throughout (Files.walk/copy/list, Path, ...).
desugar = "2.1.5"
androidx-activityCompose = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-constraintlayout = "2.2.1"
androidx-core-ktx = "1.19.0"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.9.2"
sentry = "8.50.0"
androidx-material = "1.14.0"
compose-multiplatform = "1.11.1"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
sqldroid = "1.0.3"
runtimeAndroid = "1.11.4"
uiAndroid = "1.11.4"
material3 = "1.9.0"
material3-android = "1.4.0"
ksp = "2.3.10"
jetbrainsKotlinJvm = "2.4.10"
koin = "4.2.2"
mockk = "1.14.11"
mockito = "5.23.0"
mockito-kotlin = "2.2.0"
datastore = "1.2.1"
# The -android variant, NOT -jre: guava-jre's ChecksumHashFunction and Hashing use
# MethodHandle.invoke, which D8 cannot dex below API 26 — the same failure mode tika-core has.
# -android dexes clean at 24 and is equally valid on the desktop JVM.
guava = "33.1.0-android"
junitJupiter = "5.11.4"
junitPlatform = "1.11.4"
# kotlinx-serialization + kaml (YAML). 1.9.0 is what kaml 0.104 builds against; keeping them
# aligned avoids two serialization-core versions on the classpath.
kotlinxSerialization = "1.9.0"
kaml = "0.104.0"
tika = "2.0.0"

[libraries]
sentry = { group = "io.sentry", name = "sentry", version.ref = "sentry" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "androidx-material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation"}
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
sqldroid = { module = "org.sqldroid:sqldroid", version.ref = "sqldroid" }
androidx-runtime-android = { group = "androidx.compose.runtime", name = "runtime-android", version.ref = "runtimeAndroid" }
androidx-ui-android = { group = "androidx.compose.ui", name = "ui-android", version.ref = "uiAndroid" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines"}
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-rx2 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-rx2", version.ref = "kotlinx-coroutines"}
androidx-material3-android = { group = "androidx.compose.material3", name = "material3-android", version.ref = "material3-android" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "com.nhaarman.mockitokotlin2", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
desugar-jdk-libs-nio = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugar" }
# Used by the vendored libraries under libs/ — see libs/README.md.
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
# Gradle 9 no longer puts the launcher on the test runtime classpath implicitly; without it a
# useJUnitPlatform() task fails with "Failed to load JUnit Platform".
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# YAML for kotlinx-serialization: RC manifests, burrito containers, tstudio2rc and Orature's
# plugin registry. kotlinx has no official YAML format. Verified to dex clean at min-api 24,
# along with its snakeyaml-engine-kmp and okio transitives.
kaml = { group = "com.charleskorn.kaml", name = "kaml", version.ref = "kaml" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
tika-core = { group = "org.apache.tika", name = "tika-core", version.ref = "tika" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jetbrainsKotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
