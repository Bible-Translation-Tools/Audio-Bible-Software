# TEMP: uses prebuilt APKs from tmpfiles.org instead of assembling on the runner.
# Revert to `gradle :app-recorder:connectedDebugAndroidTest -PminimalGlSources=true` when done.
name: Recorder Android E2E

on:
  push:

concurrency:
  group: recorder-android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-e2e:
    name: instrument prebuilt APKs (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Normal `run:` supports multiline; android-emulator-runner does not (splits on newlines).
      - name: Download prebuilt APKs
        run: |
          set -euo pipefail
          download_tmpfiles() {
            local VIEW_URL="$1"
            local OUT="$2"
            echo "Resolving download link from $VIEW_URL"
            local DL_URL
            DL_URL=$(curl -fsSL "$VIEW_URL" | grep -oE 'https://tmpfiles\.org/dl/[^"]+' | head -n1)
            if [ -z "$DL_URL" ]; then
              echo "Could not find tmpfiles download link on view page"
              exit 1
            fi
            echo "Downloading $DL_URL -> $OUT"
            curl -fsSL -o "$OUT" "$DL_URL"
            local HEAD
            HEAD=$(od -An -t x1 -N 2 "$OUT" | tr -d ' \n')
            if [ "$HEAD" != "504b" ]; then
              echo "Downloaded file is not an APK (magic=$HEAD, size=$(wc -c < "$OUT"))"
              head -c 200 "$OUT" || true
              exit 1
            fi
            ls -lh "$OUT"
          }
          download_tmpfiles "https://tmpfiles.org/wJwOFqyqYyHR/app-recorder-debug.apk" app.apk
          download_tmpfiles "https://tmpfiles.org/wFwHF8y7YHK1/app-recorder-debug-androidtest.apk" test.apk

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-aosp_atd-x86_64

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Install APKs and run instrumented e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: adb install -r app.apk && adb install -r test.apk && adb shell am instrument -w -r org.bibletranslationtools.recorder2.test/org.bibletranslationtools.recorder2.e2e.RecorderE2ERunner
