#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Keep app + androidTest APKs installed after connected*AndroidTest (for post-run inspection).
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Faster local / Android e2e builds: only fetch en_ulb (skip the full ~96 GL catalog download).
# Omit or set false for a full gateway-language bundle. Extra zips already under
# shared/.../files/content/ are still packed unless you delete them.
minimalGlSources=true
# AGP 9 dropped built-in compatibility with the Kotlin Multiplatform plugin when using the
# com.android.application/library plugins; bypass its built-in Kotlin + new DSL so the existing
# KMP setup keeps working (https://developer.android.com/build/releases/gradle-plugin).
android.builtInKotlin=false
android.newDsl=false