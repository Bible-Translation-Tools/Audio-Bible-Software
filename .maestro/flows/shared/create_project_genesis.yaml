appId: org.bibletranslationtools.recorder2
---
# Files → New Project → English → Afar → Genesis → Project Management → Afar's book list.
# Paths are relative to this file (shared/), not the workspace root.
- runFlow: open_files.yaml
- tapOn: "New Project"
- extendedWaitUntil:
    visible: "New Project|Select Source"
    timeout: 3000

# Prefer en_ulb, else English, else search "en".
- runFlow:
    when:
      visible: ".*en_ulb.*"
    commands:
      - tapOn: ".*en_ulb.*"
- runFlow:
    when:
      notVisible: "Choose Target Language"
      visible: ".*English.*"
    commands:
      - tapOn: ".*English.*"
- runFlow:
    when:
      notVisible: "Choose Target Language"
    commands:
      - runFlow:
          file: search_and_tap.yaml
          env:
            QUERY: "en"
            RESULT: ".*English.*"

- extendedWaitUntil:
    visible: "Choose Target Language"
    timeout: 3000
- runFlow:
    file: search_and_tap.yaml
    env:
      QUERY: "aa"
      RESULT: ".*Afar.*"

- extendedWaitUntil:
    visible: "Choose a Book"
    timeout: 3000
- runFlow:
    file: search_and_tap.yaml
    env:
      QUERY: "gen"
      RESULT: ".*Genesis.*"

- extendedWaitUntil:
    visible: "Project Management"
    timeout: 3000
# The project list shows language cards: expand Afar's, then open its one translation type.
# Both read "1 book": the language card's count comes first, the type card under it second.
- tapOn: ".*from English.*"
- tapOn:
    text: "1 book"
    index: 1
- extendedWaitUntil:
    visible: "Genesis"
    timeout: 5000
- assertVisible: ".*Genesis.*"
