name: Recorder Android E2E

on:
  push:

concurrency:
  group: recorder-android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-e2e:
    name: connectedDebugAndroidTest (API 34 google_apis)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Headed emulator needs a display (Xvfb) and libpulse (qemu links it even with -noaudio).
      - name: Start Xvfb and install emulator deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libpulse0
          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No gradle-wrapper.jar in git (*.jar ignored); install Gradle directly.
          gradle-version: 9.3.1

      - name: Cache en_ulb GL source
        uses: actions/cache@v4
        with:
          path: shared/src/commonMain/composeResources/files/content/en_ulb.zip
          key: en-ulb-${{ hashFiles('shared/src/commonMain/composeResources/files/gl_sources.json') }}

      # Assemble before the emulator so Gradle is not contending with the AVD.
      - name: Assemble app and androidTest APKs
        run: gradle :app-recorder:assembleDebug :app-recorder:assembleDebugAndroidTest -PminimalGlSources=true --stacktrace

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-pixel6-x86_64-headed

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          enable-hw-keyboard: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android instrumented e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          enable-hw-keyboard: true
          script: gradle :app-recorder:connectedDebugAndroidTest -PminimalGlSources=true --stacktrace

      - name: Upload APKs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-android-e2e-apks
          path: |
            app-recorder/build/outputs/apk/debug/*.apk
            app-recorder/build/outputs/apk/androidTest/debug/*.apk
            shared/src/commonMain/composeResources/files/embedded_gl_sources.json
            shared/src/commonMain/composeResources/files/content/en_ulb.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-android-e2e-reports
          path: |
            app-recorder/build/reports/androidTests/connected/
            app-recorder/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
