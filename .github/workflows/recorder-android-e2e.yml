name: Recorder Android E2E

on:
  push:

concurrency:
  group: recorder-android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-e2e:
    name: connectedDebugAndroidTest (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Cache en_ulb GL source
        uses: actions/cache@v4
        with:
          path: shared/src/commonMain/composeResources/files/content/en_ulb.zip
          key: en-ulb-${{ hashFiles('shared/src/commonMain/composeResources/files/gl_sources.json') }}

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-aosp_atd-x86_64

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android instrumented e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle :app-recorder:connectedDebugAndroidTest -PminimalGlSources=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-android-e2e-reports
          path: |
            app-recorder/build/reports/androidTests/connected/
            app-recorder/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
