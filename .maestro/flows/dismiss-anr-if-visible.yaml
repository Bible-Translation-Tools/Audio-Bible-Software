appId: org.bibletranslationtools.recorder2
---
# Dismiss "… isn't responding" by tapping Wait (system ANR dialog).
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn:
          id: "android:id/aerr_wait"
          optional: true
      - tapOn:
          text: "Wait"
          optional: true
