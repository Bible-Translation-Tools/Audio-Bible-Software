appId: org.bibletranslationtools.recorder2
---
# SeededRecordPlaybackFlowTest.openRecorderAndEngageTransport
# Assumes Project Management with Genesis project from smoke-create-project.
- runFlow: dismiss-anr-if-visible.yaml

# Project card mic (right of Genesis title) jumps straight into the recorder.
- tapOn:
    text: "Record"
    rightOf: ".*Genesis.*"

- extendedWaitUntil:
    visible: "Record transport"
    timeout: 3000
# loadTarget is async and does real work before the header can render: it walks every chapter of
# the book (all 50 of Genesis) and loads each one's chunks, then sets sourceLabel/bookLabel. The
# static "Record transport" above paints immediately; this header lags behind that IO, and 3s is not
# enough on the CI emulator (it is on desktop). Give it room, matching the generous waits the rest of
# the suite uses — a real empty-header regression still fails, just later.
- extendedWaitUntil:
    visible: ".*Genesis.*|.*ULB.*"
    timeout: 60000

- tapOn: "Record transport"

# Soft-pass: Stop may not appear on emulator mic; still require transport present.
- runFlow:
    when:
      visible: "Stop"
    commands:
      - tapOn: "Stop"
      - extendedWaitUntil:
          visible: "Play/Pause"
          timeout: 3000
      - assertVisible: "Play/Pause"
- runFlow:
    when:
      notVisible: "Play/Pause"
    commands:
      - assertVisible: "Record transport"

# Leave recorder (mirrors @After teardown).
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- runFlow:
    when:
      visible: "Record transport"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible: "Files|Project Management|.*Genesis.*"
    timeout: 3000
