name: Recorder Android E2E

on:
  push:

concurrency:
  group: recorder-android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-e2e:
    name: connectedDebugAndroidTest (API 34 google_apis)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # qemu still dlopens libpulse even with -noaudio on recent emulator builds.
      - name: Install emulator deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No gradle-wrapper.jar in git (*.jar ignored); install Gradle directly.
          gradle-version: 9.3.1

      - name: Cache en_ulb GL source
        uses: actions/cache@v4
        with:
          path: shared/src/commonMain/composeResources/files/content/en_ulb.zip
          key: en-ulb-${{ hashFiles('shared/src/commonMain/composeResources/files/gl_sources.json') }}

      # Assemble before the emulator so Gradle is not contending with the AVD.
      - name: Assemble app and androidTest APKs
        run: gradle :app-recorder:assembleDebug :app-recorder:assembleDebugAndroidTest -PminimalGlSources=true --stacktrace

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-pixel_tablet-x86_64-3g

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: false
          enable-hw-keyboard: true
          disk-size: 6000M
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          force-avd-creation: false
          pre-emulator-launch-script: bash .github/scripts/setup-android-emulator.sh
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android instrumented e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          enable-hw-keyboard: true
          disk-size: 6000M
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          force-avd-creation: false
          pre-emulator-launch-script: bash .github/scripts/setup-android-emulator.sh
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: bash .github/scripts/run-android-e2e.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-android-e2e-reports
          path: |
            app-recorder/build/reports/androidTests/connected/
            app-recorder/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
