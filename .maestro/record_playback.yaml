appId: org.bibletranslationtools.recorder2
tags:
  - record-playback
---
# SeededRecordPlaybackFlowTest.openRecorderAndEngageTransport
# (seeds via UI wizard instead of in-process Koin; opens recorder from project mic)
- runFlow: shared/launch_clear.yaml
- runFlow: shared/wait_main_menu.yaml
- runFlow: shared/create_afar_genesis.yaml

# Project card mic (right of Genesis title) jumps straight into the recorder.
- tapOn:
    text: "Record"
    rightOf: ".*Genesis.*"

- extendedWaitUntil:
    visible: "Record transport"
    timeout: 120000
# loadTarget is async; wait for header labels before engaging mic.
- extendedWaitUntil:
    visible: ".*Genesis.*|.*ULB.*"
    timeout: 60000

- tapOn: "Record transport"

# Soft-pass: Stop may not appear on emulator mic; still require transport present.
- runFlow:
    when:
      visible: "Stop"
    commands:
      - tapOn: "Stop"
      - extendedWaitUntil:
          visible: "Play/Pause"
          timeout: 120000
      - assertVisible: "Play/Pause"
- runFlow:
    when:
      notVisible: "Play/Pause"
    commands:
      - assertVisible: "Record transport"

# Leave recorder (mirrors @After teardown).
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- runFlow:
    when:
      visible: "Record transport"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible: "Files|Project Management|.*Genesis.*"
    timeout: 30000
